# Render Blueprint — описывает, что нужно развернуть: сервер backend'а
# RAZVIT (Food Database) + бесплатную PostgreSQL рядом с ним.
#
# Как использовать: на render.com выбрать "New" -> "Blueprint", указать
# этот GitHub-репозиторий — Render сам прочитает этот файл и создаст оба
# сервиса. Никакие пароли/ключи сюда не вписываются — они либо
# генерируются Render автоматически (пароль базы), либо вводятся в панели
# Render после создания (USDA_API_KEY).

services:
  - type: web
    name: razvit-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: razvit-db
          property: connectionString
      - key: OPEN_FOOD_FACTS_BASE_URL
        value: https://world.openfoodfacts.org
      - key: USDA_API_KEY
        sync: false # необязательно; можно вписать позже в панели Render — без него USDA просто не участвует в поиске

databases:
  - name: razvit-db
    plan: free
